[project]
name = "v-jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beartype>=0.22.2",
  "braceexpand>=0.1.7",
  "decord>=0.6.0",
  "diffusers[torch]>=0.35.2",
  "einops>=0.8.1",
  "gymnasium>=1.2.1",
  "minedojo",
  "numpy>=1.26.4",
  "opencv-python>=4.11.0.86",
  "pandas>=2.3.3",
  "pyyaml>=6.0.3",
  "scikit-image>=0.25.2",
  "submitit>=1.5.3",
  "tensorboardx>=2.6.4",
  "timm>=1.0.20",
  "torch>=2",
  "torchvision>=0.23.0",
  "tqdm>=4.67.1",
  "transformers>=4.57.1",
  "webdataset>=1.0.2",
]

[tool.uv]
constraint-dependencies = ["numpy<2.0.0"]
environments = [
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
minedojo = { git = "https://github.com/jerrykal/MineDojo.git", tag = "v0.1.1-custom.1" }

[dependency-groups]
dev = ["ipykernel>=7.0.1"]
