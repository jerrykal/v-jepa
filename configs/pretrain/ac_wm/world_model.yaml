app: world_model
nodes: 16
tasks_per_node: 8

# ======================================================================= #
#  CONFIGURATION FILE
# ======================================================================= #

meta:
  load_checkpoint: false         # Whether to load from checkpoint
  read_checkpoint: null          # Path to checkpoint file
  seed: 234                      # Random seed
  dtype: bfloat16                # Options: float32 | float16 | bfloat16


# ======================================================================= #
#  WORLD MODEL
# ======================================================================= #
world_model:
  
  pretrained_model_path: null         # Path to pretrained world model checkpoint
  fine_tune: false                    # If true, fine-tune encoder/predictor/etc.

  video_model_params:
    model_name: vit_huge               # Backbone name
    patch_size: 16                     # Spatial patch size
    num_frames: 16                     # Number of frames per clip
    tubelet_size: 2                    # Temporal patching (frames per tubelet)
    crop_size: 224                     # Crop resolution
    pred_depth: 12                     # Predictor transformer depth
    pred_embed_dim: 384                # Predictor embedding dim
    uniform_power: true                # Sampling power for uniform sampling
    use_mask_tokens: true              # Whether to use mask tokens
    adapter_type: "Concat"             # Adapter type: none|linear|lora|Concat...
    zero_init_mask_tokens: true        # Initialize mask tokens with zero

  latent_action_enc_params:
    num_heads: 8              # Attention heads
    d_codebook: 16             # Dimension per codebook (dims_action_codebook)
    n_codebook: 2             # Number of codebooks (number_action_codebook)
    vq_bias: true             # LFQ bias
    vq_commit_weight: 0.25    # Commitment loss weight
    vq_entropy_weight: 0.1    # Entropy regularization weight
    vq_diversity_weight: 1.0  # Diversity regularization weight

  state_decoder_params:
    # Pooler
    pooler_num_queries: 1       # Number of query tokens
    pooler_num_heads: 8         # Attention heads
    mlp_ratio: 4.0              # MLP expansion ratio
    pooler_depth: 2             # Number of transformer blocks
    norm_layer: "LayerNorm"     # Normalization layer type
    init_std: 0.02              # Init std for weights
    qkv_bias: true              # QKV bias
    complete_block: true        # Use complete transformer block

    # Rewards decoder
    reward_hidden_dim: 512      # Hidden dim
    reward_depth: 2             # Number of layers
    reward_num_classes: 255       # Output classes (1 for regression)

    # Termination decoder
    termin_hidden_dim: 256      # Hidden dim
    termin_depth: 2             # Number of layers

  action_projector_params:
    hidden_dims: 512            # Hidden layers
    depth: 2                    # Number of hidden layers

  optimizer_params:
    start_lr: 1.0e-6            # LR at start of warmup
    ref_lr: 3.0e-4              # Reference LR
    warmup_ratio: 0.05          # Warmup steps ratio
    wd: 0.05                    # Weight decay
    final_wd: 0.0               # Final weight decay
    final_lr: 1.0e-7            # Final learning rate
    mixed_precision: true       # Enable AMP
    total_steps: 1000000        # Total steps
    betas: [0.9, 0.95]          # Adam betas
    eps: 1.0e-8                 # Adam epsilon
    zero_init_bias_wd: false    # Exempt zero-init bias from wd

# ======================================================================= #
#  AGENT
# ======================================================================= #
agent:
  feat_len: 2                   # Sequence length pooled for agent
  gamma: 0.99                    # Discount factor
  lambd: 0.95                    # GAE lambda
  entropy_coef: 0.01             # Entropy coefficient

  pooler_params:
    num_heads: 8
    mlp_ratio: 4.0
    depth: 2
    norm_layer: "LayerNorm"
    init_std: 0.02
    qkv_bias: true
    complete_block: true

  actor_params:
    hidden_dim: 512
    num_layers: 2

  critic_params:
    hidden_dim: 512
    num_layers: 2
    output_bins: 255             # Critic output bins (e.g. for value dist)
    
  optimizer_params:
    start_lr: 1.0e-6            # LR at start of warmup
    ref_lr: 3.0e-4              # Reference LR
    warmup_ratio: 0.05          # Warmup steps ratio
    wd: 0.05                    # Weight decay
    final_wd: 0.0               # Final weight decay
    final_lr: 1.0e-7            # Final learning rate
    mixed_precision: true       # Enable AMP
    total_steps: 1000000        # Total steps
    betas: [0.9, 0.95]          # Adam betas
    eps: 1.0e-8                 # Adam epsilon
    zero_init_bias_wd: false    # Exempt zero-init bias from wd

# ======================================================================= #
#  ENVIRONMENT
# ======================================================================= #
env:
  Environment:                           # Environment-specific parameters
    task: "CombatSpider"
    task_parameter:
      image_size: [224,224]
      step_penalty: 0
      attack_reward: 1
      success_reward: 10
      max_episode_len: 250
      # max_spawn_range: 10
      # target_quantities: 1
    seed: 123
  
    action_space: "ReducedActionSpace"
    observation: "DefaultObservation" #ImageObservation
    
  frame_skip: 1                       # Frame skip per step
  maxpooling: false                   # Use frame maxpooling

# ======================================================================= #
#  REPLAY BUFFER
# ======================================================================= #
replay_buffer:
  max_length: 100000              # Maximum buffer length
  warmup_length: 1024             # Steps before training
  store_on_gpu: false             # Store buffer on GPU
  export_data_path: null          # Path to export data
  pre_collected_data_path: null   # Path to pre-collected dataset

# ======================================================================= #
#  OPTIMIZATION
# ======================================================================= #
optimization:
  max_steps: 105000             # Total training steps
  num_envs: 1                    # Number of parallel environments
  save_interval: 5000          # Interval for checkpoint saving

  train:
    batch_size: 16               # Training batch size
    seq_length: 16               # Sequence length for training

  demonstration:
    enabled: false               # Enable demonstrations
    batch_size: 4                # Demonstration batch size

  imagination:
    batch_size: 16               # Imagination rollout batch size
    seq_length: 16               # Imagination sequence length
    context_length: 16            # Context length
    demo_batch_size: 256         # Demonstration batch size for imagination

  update:
    world_model_interval: 1      # Interval for world model update
    agent_interval: 1            # Interval for agent update

# ======================================================================= #
#  LOGGING
# ======================================================================= #
logging:
  folder: "./logs/world_model"               # Folder for logs
  write_tag: "wm"       # Logging tag
