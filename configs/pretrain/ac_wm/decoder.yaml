app: decoder
nodes: 16
tasks_per_node: 8

data:
  dataset_type: VideoDataset
  datasets:
    - /media/cgv/1tb_disk/EmboodiedAgent/CLIP4MC_Dataset/export.csv
  decode_one_clip: true #not using
  batch_size: 24
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 4
  filter_short_videos: false
  clip_duration: null

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0

logging:
  folder: /home/cgv/Documents/project/EmbodiedAgent/v-jepa/logs/ac_wm
  write_tag: ac_jepa

loss:
  loss_exp: 1.0
  reg_coeff: 0.0
  quant_coeff: 1.0

mask:
  - aspect_ratio: # dummy
      - 1.0
      - 1.0
    num_blocks: 1
    spatial_scale:
      - 1.0
      - 1.0
    temporal_scale:
      - 0.1
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null

meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
  pre_train_model: "/media/cgv/1tb_disk/vith16.pth.tar"

model:
  model_name: vit_huge
  uniform_power: true
  decoder_layers: 2
  decoder_stem_dim: 64
  training_model_list: ["encoder", "decoder"]

optimization:
  ipe: 300
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 100
  warmup: 40
  start_lr: 0.0002
  lr: 0.000625
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0
