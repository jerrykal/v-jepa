data:
  dataset_type: VideoDataset
  datasets:
    - data/CLIP4MC_Dataset/eval.csv
  decode_one_clip: true #not using
  batch_size: 50
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 4
  filter_short_videos: false
  clip_duration: null

logging:
  folder: logs/test/vit_decoder_vith16_overfit_eval_set

meta:
  read_checkpoint: logs/train/vit_decoder_vith16_overfit/vit_decoder-latest.pth.tar
  seed: 234
  use_sdpa: true
  dtype: bfloat16
  pre_train_model: weights/vith16.pth.tar

model:
  model_name: vit_huge
  uniform_power: true
  decoder_depth: 8
  decoder_num_heads: 16
  decoder_mlp_ratio: 4.0