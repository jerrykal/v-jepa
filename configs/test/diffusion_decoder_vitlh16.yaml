app: diffusion_decoder
nodes: 16
tasks_per_node: 8

data:
  dataset_type: VideoDataset
  datasets:
    - data/CLIP4MC_Dataset/export.csv
  decode_one_clip: true #not using
  batch_size: 1
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 4
  filter_short_videos: false
  clip_duration: null

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0

meta:
  save_dir: logs/test_diffusion_decoder_vith16
  read_checkpoint: logs/diffusion_decoder_vith16/diffusion_decoder-latest.pth.tar
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
  pre_train_model: weights/vith16.pth.tar

model:
  model_name: vit_huge
  uniform_power: true

diffusion:
  jepa_conditioned: true
  in_channels: 3
  out_channels: 3
  layers_per_block: 2
  block_out_channels:
    - 64
    - 128
    - 256
    - 256
  down_block_types:
    - "DownBlock2D"
    - "DownBlock2D"
    - "CrossAttnDownBlock2D"
    - "DownBlock2D"
  up_block_types:
    - "UpBlock2D"
    - "CrossAttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
  scheduler_beta_start: 0.00085
  scheduler_beta_end: 0.012
  scheduler_beta_schedule: "scaled_linear"
  scheduler_prediction_type: "epsilon"

inference:
  num_inference_steps: 50
  num_samples_to_generate: 50